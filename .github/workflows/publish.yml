name: Publish to NPM

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: mise run build

      - name: Type check
        run: mise run typecheck

      - name: Lint
        run: mise run lint

      - name: Run tests
        run: mise run test

      - name: Verify CLI binary
        run: |
          test -f bin/ah
          test -x bin/ah

  build-and-publish:
    name: Build and Publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Setup Node.js for NPM
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: mise run build

      - name: Verify build
        run: |
          ls -la dist/
          test -f dist/index.js
          test -f dist/index.d.ts
          test -f bin/ah
          test -x bin/ah

      - name: Publish to NPM
        run: npx --yes npm@^11.5.1 publish

  create-release:
    name: Create GitHub Release
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Published to NPM: `@piwero/ai-harness-cli@${{ steps.get_version.outputs.VERSION }}`
            
            Install globally:
            ```bash
            npm install -g @piwero/ai-harness-cli
            ```
            
            Install locally in project:
            ```bash
            npm install --save-dev @piwero/ai-harness-cli
            ```
